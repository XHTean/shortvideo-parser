version: "3.8"

services:
  parser-api:
    build: .
    image: shortvideo-parser-api:latest
    container_name: shortvideo-parser-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
